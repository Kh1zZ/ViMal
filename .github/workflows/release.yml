name: Build & Release ViMal

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "No KEYSTORE_BASE64 secret provided, will use fallback signature."
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Build Release APK Only (No unit tests in CI - unit tests run locally only)
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK Name
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.1"
          fi
          VERSION_CLEAN=$(echo "$VERSION" | sed 's/^v//')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_CLEAN}"
          fi
          APK_NAME="vimal-release-${TAG}.apk"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${APK_NAME}"
          echo "Prepared release APK: ${APK_NAME}"

      # Upload release APK artifact on every push
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/release/${{ env.APK_NAME }}
          retention-days: 14

      # Publish directly to GitHub Releases on EVERY push or tag
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ViMal ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/release/${{ env.APK_NAME }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
